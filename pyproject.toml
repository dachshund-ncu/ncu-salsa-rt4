[project]
name = "ncu_salsa_rt4"
version = "0.1.3"
description = "A set of tools for managing spectral data from autocorrelator"
authors = [
    { name="Michał Durjasz", email="md@astro.umk.pl" }
]
requires-python = ">=3.11"
dependencies = [
    "mpmath",
    "astropy",
    "barycorrpy",
    "validators",
    "numpy",
    "pytest",
    "pandas",
    "fitsio",
    "pandas-stubs",
    "astropy",
    "Werkzeug"
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
